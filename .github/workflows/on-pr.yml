name: Run end-to-end-tests on pull-requests

on:
  pull_request:

jobs:
  run-end-to-end-tests:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      - name: 'Build the code for the components'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@main
        with:
          component_names: |
            arkiv-mock
            soknadsmottaker
            innsending-api
            soknadsarkiverer@${{ github.head_ref }}
          prepull_test_images: true
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 'Run the end-to-end-tests'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@main
        with:
          component_name: archiving-infrastructure
          branch: main
          sub_directory: system-tests
          skip_tests: false
          run_docker_build: false
