spring:
  profiles:
    active: test

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${token.server.port}/azuread
          audiences: aud-localhost
          jwk-set-uri: http://localhost:${token.server.port}/azuread/.well-known/openid-configuration
      client:
        registration:
          arkiv:
            client-id: fake
            client-secret: someSecret
            provider: azuread
            authorization-grant-type: client_credentials
            scope: scope
          saf-maskintilmaskin:
            client-id: fake
            client-secret: someSecret
            provider: azuread
            authorization-grant-type: client_credentials
            scope: scope
          innsending-api:
            client-id: fake
            client-secret: someSecret
            provider: azuread
            authorization-grant-type: client_credentials
            scope: scope

        provider:
          azuread:
            token-uri: http://localhost:6969/fake/token

token:
  server:
    port: 1888

auth:
  issuers:
    azuread:
      issuer-uri: http://localhost:6969/azuread
      jwk-set-uri: http://localhost:6969/azuread/.well-known/openid-configuration



cron:
  startRetryOfFailedArchiving: 45 08 01 16 JAN ?
failedApplications: ""
application:
  SPRING_PROFILES_ACTIVE: test
  schema-registry-scope: mocked-scope
  KAFKA_SCHEMA_REGISTRY: mock://mocked-scope
  KAFKA_STREAMS_APPLICATION_ID: testApplicationId
  mocked-port-for-external-services: 2908
  BOOTSTRAPPING_TIMEOUT: 1
  DELAY_BEFORE_KAFKA_INITIALIZATION: 0
kafka:
  applicationId: ${application.KAFKA_STREAMS_APPLICATION_ID}
  brokers: localhost:29092
  bootstrappingTimeout: ${application.BOOTSTRAPPING_TIMEOUT}
  delayBeforeKafkaInitialization: ${application.DELAY_BEFORE_KAFKA_INITIALIZATION}
  security:
    enabled: FALSE
    protocol: SSL
    keyStoreType: PKCS12
    keyStorePath: dummy
    keyStorePassword: dummy
    trustStorePath: dummy
    trustStorePassword: dummy
  topics:
    processingTopic: privat-soknadinnsending-processingeventlog-v2-dev
    messageTopic: privat-soknadinnsending-messages-v2-dev
    arkiveringstilbakemeldingTopic: privat-soknadinnsending-arkiveringstilbakemeldinger-v1-dev
    metricsTopic: privat-soknadinnsending-metrics-v2-dev
    nologinSubmissionTopic: privat-soknadinnsending-nologin-submission-v1-dev
    loggedinSubmissionTopic: privat-soknadinnsending-loggedin-submission-v1-dev
  schemaRegistry:
    url: ${application.KAFKA_SCHEMA_REGISTRY}
    username: dummy
    password: dummy
services:
  tasklist:
    scheduling:
      startUpSeconds: 4
      secondsBetweenRetries: [0,1,0,0,0,0]

no.nav.security:
  jwt:
    issuer.azuread:
      discoveryurl: http://localhost:${mock-oauth2-server.port}/azuread/.well-known/openid-configuration
      accepted_audience: aud-localhost
    client:
      registration:
        innsendingApi:
          token-endpoint-url: http://localhost:${mock-oauth2-server.port}/azuread/token
          grant-type: client_credentials
          scope: "api://dev-gcp.team-soknad.innsending-api/.default"
          authentication:
            client-id: "dev-gcp:team-soknad:soknadsarkiverer"
            client-secret: secret
            client-auth-method: client_secret_basic
        arkiv:
          token-endpoint-url: http://localhost:${mock-oauth2-server.port}/azuread/token
          grant-type: client_credentials
          scope: "api://dev-gcp.team-soknad.arkiv-mock/.default"
          authentication:
            client-id: "dev-gcp:team-soknad:soknadsarkiverer"
            client-secret: secret
            client-auth-method: client_secret_basic

        saf-maskintilmaskin:
          token-endpoint-url: http://localhost:${mock-oauth2-server.port}/azuread/token
          grant-type: client_credentials
          scope: "api://dev-gcp.team-soknad.arkiv-mock/.default"
          authentication:
            client-id: "dev-gcp:team-soknad:soknadsarkiverer"
            client-secret: secret
            client-auth-method: client_secret_basic
joark:
  host: http://localhost:2908
  sendToJoark: true
  journal-post: /rest/journalpostapi/v1/journalpost
innsendingapi:
  host: http://localhost:2908
saf:
  url: http://localhost:2908
  path: /graphql
applicationName: soknadsarkiverer
filefetchtimeouts:
  connectTimeout: 20
  callTimeout: 62
  readTimeout: 1
  writeTimeout: 1
archivingtimeouts:
  connectTimeout: 2
  readTimeout: 4
  exchangeTimeout: 4

status_log_url: "https://logs.adeo.no"
