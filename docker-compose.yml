services:
  authserver:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    ports:
      - "6969:6969"
    environment:
      TZ: Europe/Oslo
      SERVER_PORT: 6969
      JSON_CONFIG: '{
    "interactiveLogin": true,
    "httpServer": "NettyWrapper",
    "tokenCallbacks": [
      {
        "issuerId": "azuread",
        "tokenExpiry": 600000,
        "requestMappings": [
          {
            "requestParam": "scope",
            "match": "openid somescope",
            "claims": {
              "sub": "sendsoknad-boot",
              "aud": "azuread-client-id",
              "NAVident": "A123456",
              "pid": "28898698736",
              "name": "Test Testesen"
            }
          }
        ]
      }
    ]
  }'
  kafka:
    image: confluentinc/cp-kafka:8.3.2
    ports:
      - 29092:29092
    environment:
      CLUSTER_ID: EUcHENILQ6GICuEwv_bjgA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
